# snp-phewas curated dataset catalog.
#
# One entry per served dataset_id. Every field here is read by catalog.py; nothing is
# decorative. A dataset that is not listed here cannot be queried (the lookup refuses an
# unknown id), so this file IS the curation.
#
# license_verdict / license_verified: read from the source page on the stated date, not
# from memory. attribution: the exact string every output that shows this dataset's
# numbers must carry.
#
# release pins: a release bump changes these and must rebuild everything keyed on them
# (the outcome catalogs via snp_phewas_build_catalogs.py, the crosswalk, the demo slices
# and the golden test values).

